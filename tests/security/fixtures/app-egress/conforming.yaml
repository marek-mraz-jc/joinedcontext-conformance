# The policy the Portal renders for an App that declared two public networks (T-2838): DNS, the
# mesh, the gateway's pods, and each declared network with the private ranges inside it cut out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bikes
  namespace: jc-banskabystrica-apps
  labels:
    app.kubernetes.io/managed-by: joinedcontext-portal
    joinedcontext.com/app: "true"
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: bikes }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: apisix } }
          podSelector: { matchLabels: { app.kubernetes.io/name: apisix } }
      ports: [{ protocol: TCP, port: 8080 }, { protocol: TCP, port: 4143 }]
    - ports: [{ protocol: TCP, port: 4190 }, { protocol: TCP, port: 4191 }]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: linkerd } }
      ports: [{ protocol: TCP, port: 8080 }, { protocol: TCP, port: 8086 }, { protocol: TCP, port: 8090 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: context-gateway } }
          podSelector: { matchLabels: { app.kubernetes.io/name: context-gateway-gateway } }
      ports: [{ protocol: TCP, port: 8080 }, { protocol: TCP, port: 4143 }]
    - to:
        - ipBlock: { cidr: 0.0.0.0/1, except: [10.0.0.0/8, 100.64.0.0/10] }
      ports: [{ protocol: TCP, port: 443 }]
    - to:
        - ipBlock: { cidr: 8.8.8.8/32 }
      ports: [{ protocol: TCP, port: 443 }]

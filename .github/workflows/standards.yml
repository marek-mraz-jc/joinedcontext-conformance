name: standards
# The standards suite on demand (T-5044): OGC API Features ETS, SensorThings, OData, an NGSI-LD read
# smoke (plus the ETSI smoke.robot on a dev write Endpoint, never the TTF suite), iCalendar RFC 5545
# with the Event mapping, the WebSocket surface through the gateway and the anonymous MCP tools,
# against each chosen Endpoint of dev or prod. Prod runs anonymous, read-only and paced. The run page
# shows one row per Endpoint and suite; the report folder is the artifact. Dispatch only: no
# schedule (CLAUDE.md, Actions minutes); the hourly and nightly batches call tests/standards/run.sh.
on:
  workflow_dispatch:
    inputs:
      target:
        description: system under test
        type: choice
        options: [dev, prod]
        default: dev
      endpoints:
        description: Endpoint ids, space separated (empty = tests/standards/endpoints-dev.txt or tests/prod-nightly/endpoints.txt)
        required: false
        default: ""
      suites:
        description: all, or any of ogc sta odata ngsi-ld ical ws mcp (space or comma separated)
        required: false
        default: all
      antares_ref:
        description: Antares commit or branch whose OGC baseline and ETS image the run uses (the one the target runs)
        required: false
        default: dev
      write_endpoint:
        description: dev only, the write Endpoint for ETSI smoke.robot and the WebSocket write case (needs NGSILD_CLIENT_SECRET)
        required: false
        default: mluyob4nz52lok3ssk7pgn5vwt
      org_domain:
        description: dev only, the org-domain of the ids smoke.robot mints
        required: false
        default: hel.fi
      space:
        description: dev only, the context space of the write Endpoint
        required: false
        default: ovzdusie
permissions: { contents: read }
concurrency: { group: "standards-${{ inputs.target }}", cancel-in-progress: false }
jobs:
  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Antares checkout (OGC ETS image and baseline)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: marek-mraz-jc/Antares-NGSI-LD-Context-Broker
          ref: ${{ inputs.antares_ref }}
          path: antares
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes -r requirements.txt
      - name: mint the CI service account token (dev only, skipped without the client secret)
        id: token
        if: inputs.target == 'dev'
        env:
          CLIENT_SECRET: ${{ secrets.NGSILD_CLIENT_SECRET }}
          TOKEN_URL: https://idm.dev.joinedcontext.com/realms/dev/protocol/openid-connect/token
          CLIENT_ID: banskabystrica-conformance
        run: |
          set -eu
          if [ -z "$CLIENT_SECRET" ]; then echo "no NGSILD_CLIENT_SECRET: the dev write cases are skipped"; exit 0; fi
          token=$(curl -fsS -X POST "$TOKEN_URL" -d grant_type=client_credentials -d "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: run the standards suite
        env:
          TARGET: ${{ inputs.target }}
          ENDPOINTS: ${{ inputs.endpoints }}
          SUITES: ${{ inputs.suites }}
          ANTARES_DIR: ${{ github.workspace }}/antares
          OUT: ${{ github.workspace }}/reports/standards
          NGSILD_TOKEN: ${{ steps.token.outputs.token }}
          WRITE_ENDPOINT: ${{ inputs.write_endpoint }}
          NGSILD_ORG_DOMAIN: ${{ inputs.org_domain }}
          NGSILD_SPACE: ${{ inputs.space }}
        run: tests/standards/run.sh
      - name: summary table on the run page
        if: always()
        run: |
          cat reports/standards/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "No summary: the run stopped before its table." >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: standards-${{ inputs.target }}
          path: reports/standards
          retention-days: 30

name: image
# builds, smoke-tests, signs and publishes the conformance runner image (T-0053, TS-23).
# On a tag and on demand only for now: this repository is private, its Actions minutes are metered
# (T-0402/T-0521), and a runner image built on every push was the biggest single spend. Put
# `branches: [main]` back under `push:` when the minutes are back.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "image-${{ github.ref }}", cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    # The one job that pushes and signs the image; a job added to this file later gets read only.
    permissions: { contents: read, packages: write, id-token: write }
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: build for the local daemon
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: conformance-runner:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test — every installed tool answers, container is non-root
        run: |
          set -eu
          test "$(docker run --rm --entrypoint id conformance-runner:smoke -un)" = testrunner
          docker run --rm conformance-runner:smoke --selftest
          docker run --rm conformance-runner:smoke --list | grep -qx etsi
          docker run --rm conformance-runner:smoke --help
      - name: performance budgets fail a slow gateway and the benchmark reads both hops (T-0065)
        run: docker run --rm --network none --entrypoint python3 conformance-runner:smoke /tests/k6/selftest.py
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }},ghcr.io/${{ github.repository }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
      - run: echo "runner image ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      # OPS-41 asks for the bill of materials in CycloneDX; `sbom: true` above attaches
      # BuildKit's SPDX one. The CycloneDX document is read off the pushed digest and attested
      # to it, because an uploaded artifact expires and an attestation travels with the image
      # (T-2412).
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}"
          format: cyclonedx
          output: sbom.cdx.json
      - run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
      # Read back what was just attested, by the same digest and under the identity of this
      # workflow: a lane that stops attesting, or attests under another identity, goes red here
      # instead of publishing an image nothing describes. Before the vulnerability gate below,
      # because an image that fails that gate is the one whose contents somebody needs.
      - run: |
          cosign verify-attestation --type cyclonedx \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/image.yml@${{ github.ref }}" \
            "ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}" > /dev/null
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

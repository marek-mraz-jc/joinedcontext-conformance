name: feeds-sweep
# Every Atom, RSS and JSON Feed a catalogue's dataset pages advertise, validated with
# compliance/feeds/validate_feed.py (T-5201): document, HTTP and cross-format rules, one tsv row per
# feed. Read only, https only, on the catalogue's own hosts. Dispatch only (private repo minutes).
on:
  workflow_dispatch:
    inputs:
      catalogue:
        description: CKAN base URL whose dataset pages are swept
        required: true
        default: https://opendata.dev.joinedcontext.com
      lang:
        description: content language every feed must declare
        required: true
        default: sk
      allow_host:
        description: another host the feeds may live on, e.g. the gateway (empty = the catalogue's only)
        required: false
        default: ""
permissions: { contents: read }
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes -r requirements.txt
      - name: sweep the catalogue's feeds
        env:
          CATALOGUE: ${{ inputs.catalogue }}
          FEED_LANG: ${{ inputs.lang }}
          ALLOW_HOST: ${{ inputs.allow_host }}
        run: |
          set -eu
          extra=()
          if [ -n "$ALLOW_HOST" ]; then extra=(--allow-host "$ALLOW_HOST"); fi
          python3 compliance/feeds/validate_feed.py --sweep "$CATALOGUE" --lang "$FEED_LANG" \
            --out "${RUNNER_TEMP}/feeds-sweep.tsv" "${extra[@]}" || status=$?
          column -t -s $'\t' "${RUNNER_TEMP}/feeds-sweep.tsv" >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: feeds-sweep, path: "${{ runner.temp }}/feeds-sweep.tsv" }

name: etsi-gateway
# The ETSI smoke suite through a real Context Gateway (matrix 3 of docs/Testing/02 §1; T-0276).
# The broker is the fixed reference and is pinned by digest (the image dev runs, its views and
# `joinedcontext` engine on: the gateway serves every Endpoint through the broker's view, T-3643); the gateway is the system under
# test and is deliberately the latest main image, because the lane exists to catch what the
# platform repo just pushed. Green means: every case passes except the ones the quarantine
# list names by task id, and none of those has started passing (that goes red too, so the
# list cannot rot).
# Nightly and on demand, not on every push: the shared runner queue keeps room for the Antares
# trains (T-3289).
on:
  schedule: [{ cron: "30 3 * * *" }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SLUG: adldef3aksndswos6ug4pv5cpf  # the fixed slug of tests/etsi/gateway-lab
      PROJECTED_SLUG: projectedaksndswos6ug4pv5cpf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes -r requirements.txt
      - name: broker and gateway
        run: |
          set -eu
          docker network create jclab
          docker run -d --name jc-broker --network jclab -p 9090:9090 -e ANTARES_STORE=memory -e ANTARES_API_SURFACES=admin,views,access \
            -e ANTARES_POLICY=joinedcontext \
            -e ANTARES_POLICY_SUBJECT_HEADERS=x-jc-subject,x-jc-groups,x-jc-roles,x-jc-client,x-jc-restricted,x-jc-did \
            ghcr.io/marek-mraz-jc/antares-broker-jc@sha256:507437a9a902fa5b24d67dfa5a19c5a281dc11892185bb603fd8c667e12a4111
          docker run -d --name jc-gw --network jclab -p 8080:8080 \
            -v "$PWD/tests/etsi/gateway-lab:/repo:ro" \
            -e JC_GATEWAY_BROKER_URL=http://jc-broker:9090 \
            -e JC_GATEWAY_ORG_DOMAIN=banskabystrica.sk \
            -e JC_GATEWAY_REPO_DIR=/repo \
            ghcr.io/marek-mraz-jc/joinedcontext-platform:main
          for i in $(seq 1 30); do
            curl -fsS "http://localhost:9090/q/health" >/dev/null 2>&1 \
              && curl -fsS "http://localhost:8080/healthz" >/dev/null 2>&1 && break
            sleep 1
          done
          tests/etsi/gateway-lab/seed.sh http://localhost:9090
          curl -fsS "http://localhost:8080/api/endpoint/$SLUG/access" | grep -q '"space":"bb-ovzdusie-ovzdusie"' \
            || { echo "the gateway did not load tests/etsi/gateway-lab"; docker logs jc-gw; exit 1; }
          curl -fsS "http://localhost:8080/api/endpoint/$PROJECTED_SLUG/access" | grep -q '"space":"bb-ovzdusie-ovzdusie"' \
            || { echo "the gateway did not load projected endpoint in tests/etsi/gateway-lab"; docker logs jc-gw; exit 1; }
      - name: the smoke suite through the gateway, quarantine applied
        env:
          NGSILD_URL: http://localhost:8080/api/endpoint/${{ env.SLUG }}/ngsi-ld/v1
          NGSILD_ORG_DOMAIN: banskabystrica.sk
          NGSILD_SPACE: ovzdusie
          NGSILD_EXPECTED_FAILURES: tests/etsi/expected_failures_gateway.json
          NGSILD_REASON: etsi-gateway conformance fixture
          JC_REPORTS_DIR: ${{ github.workspace }}/reports/smoke
        run: timeout 120 tests/etsi/run.sh --include smoke
      - name: temporal and projected suites through the gateway
        env:
          NGSILD_URL: http://localhost:8080/api/endpoint/${{ env.SLUG }}/ngsi-ld/v1
          NGSILD_PROJECTED_URL: http://localhost:8080/api/endpoint/${{ env.PROJECTED_SLUG }}/ngsi-ld/v1
          NGSILD_ORG_DOMAIN: banskabystrica.sk
          NGSILD_SPACE: ovzdusie
          NGSILD_EXPECTED_FAILURES: tests/etsi/expected_failures_gateway.json
          NGSILD_REASON: etsi-gateway conformance fixture
          JC_REPORTS_DIR: ${{ github.workspace }}/reports/temporal
        run: timeout 120 tests/etsi/run.sh --include temporal
      - name: merge reports and check claims
        run: |
          set -eu
          mkdir -p reports/etsi-gateway
          rebot --outputdir reports/etsi-gateway -o output.xml reports/smoke/output.xml reports/temporal/output.xml
          python3 scripts/generate-qualification-report.py \
            --claims tests/etsi/claims.json \
            --reports reports/etsi-gateway
      - if: always()
        run: docker logs jc-gw 2>&1 | tail -50
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: etsi-gateway-report
          path: reports/etsi-gateway
          retention-days: 14

name: security
# Gateway security suites against a running system (T-0082, T-0083, T-0084).
# Dispatch-only until the gateway answers on dev; tokens come from repository secrets.
on:
  workflow_dispatch:
    inputs:
      space_url:
        description: space surface under test
        required: true
        default: https://2.28.67.127.sslip.io/cs/ovzdusie/ngsi-ld/v1
      other_space_url:
        description: a second space the caller has no grant on
        required: true
        default: https://2.28.67.127.sslip.io/cs/doprava/ngsi-ld/v1
permissions: { contents: read }
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes -r requirements.txt
      - name: run the security suites
        env:
          SPACE_URL: ${{ inputs.space_url }}
          OTHER_SPACE_URL: ${{ inputs.other_space_url }}
          TOKEN_VIEWER: ${{ secrets.TOKEN_VIEWER }}
          TOKEN_STEWARD: ${{ secrets.TOKEN_STEWARD }}
          GRANTED_ENTITY_ID: ${{ vars.GRANTED_ENTITY_ID }}
          FORBIDDEN_ENTITY_ID: ${{ vars.FORBIDDEN_ENTITY_ID }}
          HIDDEN_ATTR: ${{ vars.HIDDEN_ATTR }}
          # Organisation and project isolation, end to end (T-1708): two projects, one token
          # each, and one address per door. Every door skips when its variable is not set.
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          PROJECT_A: ${{ vars.PROJECT_A }}
          PROJECT_B: ${{ vars.PROJECT_B }}
          TOKEN_PROJECT_A: ${{ secrets.TOKEN_PROJECT_A }}
          TOKEN_PROJECT_B: ${{ secrets.TOKEN_PROJECT_B }}
          OTHER_ENDPOINT_URL: ${{ vars.OTHER_ENDPOINT_URL }}
          OTHER_ARTIFACT_URL: ${{ vars.OTHER_ARTIFACT_URL }}
          FORGE_URL: ${{ vars.FORGE_URL }}
          OTHER_FORGE_REPO: ${{ vars.OTHER_FORGE_REPO }}
          OTHER_RUN_ID: ${{ vars.OTHER_RUN_ID }}
          BROKER_URL: ${{ vars.BROKER_URL }}
          MCP_URL: ${{ vars.MCP_URL }}
          JC_REPORTS_DIR: ${{ github.workspace }}/reports/security
        run: tests/security/run.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-report
          path: reports/security
          retention-days: 30

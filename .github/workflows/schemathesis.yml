name: schemathesis
# Portal API contract fuzzing against a running system (T-0063, TS-09, T-1658).
# Dispatch-only, and never against dev: 500 generated writes per operation would propose real
# Changes there. The target is a throwaway Portal, named on each dispatch. One run per demo role
# whose token secret is set (viewer, steward, approver); a viewer's accepted write fails the run.
on:
  workflow_dispatch:
    inputs:
      portal_url:
        description: Portal API root of a throwaway system under test, never dev
        required: true
      gateway_url:
        description: Context Gateway root of the same throwaway system
        required: false
        default: ""
      gateway_openapi_url:
        description: Gateway OpenAPI document URL (if published)
        required: false
        default: ""
      endpoint_slug:
        description: Endpoint slug under test
        required: false
        default: ""
      schema_major:
        description: Schema major version
        required: false
        default: "v1"
      examples:
        description: test cases per operation (TS-09 asks for at least 500)
        required: true
        default: "500"
permissions: { contents: read }
jobs:
  schemathesis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes -r requirements.txt
      - name: fuzz Portal and Gateway API surfaces
        env:
          PORTAL_URL: ${{ inputs.portal_url }}
          PORTAL_TOKEN: ${{ secrets.PORTAL_TOKEN }}
          PORTAL_TOKEN_VIEWER: ${{ secrets.PORTAL_TOKEN_VIEWER }}
          PORTAL_TOKEN_STEWARD: ${{ secrets.PORTAL_TOKEN_STEWARD }}
          PORTAL_TOKEN_APPROVER: ${{ secrets.PORTAL_TOKEN_APPROVER }}
          GATEWAY_URL: ${{ inputs.gateway_url }}
          GATEWAY_OPENAPI_URL: ${{ inputs.gateway_openapi_url }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
          ENDPOINT_SLUG: ${{ inputs.endpoint_slug }}
          SCHEMA_MAJOR: ${{ inputs.schema_major }}
          JC_SCHEMATHESIS_EXAMPLES: ${{ inputs.examples }}
          JC_REPORTS_DIR: ${{ github.workspace }}/reports/schemathesis
        run: tests/schemathesis/run.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schemathesis-report
          path: reports/schemathesis
          retention-days: 30

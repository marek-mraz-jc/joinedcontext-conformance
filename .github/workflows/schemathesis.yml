name: schemathesis
# Portal API contract fuzzing against a running system (T-0063, TS-09).
# Dispatch-only until the Portal answers on dev; the token comes from a repository secret.
on:
  workflow_dispatch:
    inputs:
      portal_url:
        description: Portal API root under test
        required: true
        default: https://portal.2.28.67.127.sslip.io
      gateway_url:
        description: Context Gateway root under test
        required: false
        default: https://gateway.2.28.67.127.sslip.io
      gateway_openapi_url:
        description: Gateway OpenAPI document URL (if published)
        required: false
        default: ""
      endpoint_slug:
        description: Endpoint slug under test
        required: false
        default: ""
      schema_major:
        description: Schema major version
        required: false
        default: "v1"
      examples:
        description: test cases per operation (TS-09 asks for at least 500)
        required: true
        default: "500"
permissions: { contents: read }
jobs:
  schemathesis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes -r requirements.txt
      - name: fuzz Portal and Gateway API surfaces
        env:
          PORTAL_URL: ${{ inputs.portal_url }}
          PORTAL_TOKEN: ${{ secrets.PORTAL_TOKEN }}
          GATEWAY_URL: ${{ inputs.gateway_url }}
          GATEWAY_OPENAPI_URL: ${{ inputs.gateway_openapi_url }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
          ENDPOINT_SLUG: ${{ inputs.endpoint_slug }}
          SCHEMA_MAJOR: ${{ inputs.schema_major }}
          JC_SCHEMATHESIS_EXAMPLES: ${{ inputs.examples }}
          JC_REPORTS_DIR: ${{ github.workspace }}/reports/schemathesis
        run: tests/schemathesis/run.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-report
          path: reports/schemathesis
          retention-days: 30

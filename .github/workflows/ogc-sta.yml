name: ogc-sta
# OGC API - Features and SensorThings conformance against a running endpoint
# (T-0057, T-0058, T-0059, TS-07, TS-08). Dispatch-only until an endpoint answers on dev.
on:
  workflow_dispatch:
    inputs:
      landing_url:
        description: OGC Features landing page of the endpoint
        required: true
        default: https://dev.joinedcontext.com/api/endpoint/ovzdusie/ogc/features
      sta_url:
        description: SensorThings root of the endpoint
        required: true
        default: https://dev.joinedcontext.com/api/endpoint/ovzdusie/sta/v1.1
      collections:
        description: how many collections the OGC Abstract Test Suite covers (-1 = all)
        required: false
        default: "3"
permissions: { contents: read }
jobs:
  ogc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes -r requirements.txt
      - name: query contract and the official Abstract Test Suite
        env:
          OGC_LANDING_URL: ${{ inputs.landing_url }}
          OGC_TOKEN: ${{ secrets.TOKEN_VIEWER }}
          OGC_COLLECTION: ${{ vars.OGC_COLLECTION }}
          OGC_COLLECTIONS: ${{ inputs.collections }}
          JC_REPORTS_DIR: ${{ github.workspace }}/reports/ogc
        run: tests/ogc/run.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ogc-report
          path: reports/ogc
          retention-days: 30
  sta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes -r requirements.txt
      - name: SensorThings Sensing Profile read path
        env:
          STA_URL: ${{ inputs.sta_url }}
          STA_TOKEN: ${{ secrets.TOKEN_VIEWER }}
          JC_REPORTS_DIR: ${{ github.workspace }}/reports/sta
        run: tests/sta/run.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sta-report
          path: reports/sta
          retention-days: 30

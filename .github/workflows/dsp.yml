name: dsp
# Eclipse Dataspace Protocol TCK against the connector addon (T-0062, DS-05).
# Dispatch-only until the connector answers on dev.
on:
  workflow_dispatch:
    inputs:
      dsp_url:
        description: connector dataspace protocol URL
        required: true
        default: https://dev.joinedcontext.com/api/v1/dsp
      dsp_base_url:
        description: connector base URL serving the metadata endpoint
        required: true
        default: https://dev.joinedcontext.com/api/dsp
      participant_id:
        description: connector agent id (did:web of the organization domain, DS-04)
        required: true
        default: did:web:banskabystrica.sk
permissions: { contents: read }
jobs:
  tck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: run the dataspace protocol test kit
        env:
          DSP_URL: ${{ inputs.dsp_url }}
          DSP_BASE_URL: ${{ inputs.dsp_base_url }}
          DSP_PARTICIPANT_ID: ${{ inputs.participant_id }}
          DSP_AUTHORIZATION: ${{ secrets.DSP_AUTHORIZATION }}
          JC_REPORTS_DIR: ${{ github.workspace }}/reports/dsp
        run: tests/dsp/run.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsp-tck-report
          path: reports/dsp
          retention-days: 30
